<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>天衍 - 前端预览</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
<style>
/* ============ 基础变量 (羊皮纸主题) ============ */
:root{
  --paper:#f6efd9;--paper2:#efe4c5;--paper3:#e6d6ac;--paper4:#d8c596;
  --ink:#2e1f15;--ink2:#5a4434;--muted:#9a8062;
  --border:#c9b896;--border2:#b09872;
  --accent:#a13d3d;--accent-soft:#c45a5a;--accent2:#5a6b3f;
  --green:#5a6b3f;--yellow:#9a6b1f;--red:#a13d3d;
  --blue:#3d6b8b;--blue-soft:#5a8aab;
  --shadow-sm:0 1px 2px rgba(46,31,21,.05);
  --shadow-md:0 2px 8px rgba(46,31,21,.08);
  --radius:8px;--radius-sm:6px;--radius-lg:12px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Helvetica Neue",-apple-system,"Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;
  background-image:radial-gradient(ellipse at top,rgba(255,250,235,.5),transparent 60%),
  radial-gradient(ellipse at bottom,rgba(216,200,158,.3),transparent 60%)}

/* ============ 顶栏 ============ */
.topbar{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:10px;padding:0 14px;background:var(--paper2);
  box-shadow:0 1px 3px rgba(46,31,21,.05)}
.topbar .logo{font-size:16px;font-weight:700;font-family:var(--serif);color:var(--ink);
  letter-spacing:.6px;display:flex;align-items:center;gap:6px}
.topbar .logo span{color:var(--accent)}
.topbar .proj-info{font-weight:600;font-size:14px;margin-left:12px}
.topbar .spacer{flex:1}

/* 连接状态 */
.conn-status{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;
  border-radius:10px;font-size:11px;font-family:var(--sans);color:var(--muted)}
.conn-status.online .conn-dot{background:var(--green);box-shadow:0 0 4px var(--green)}
.conn-status.offline{background:rgba(161,61,61,.08);color:var(--red)}
.conn-status.offline .conn-dot{background:var(--red);box-shadow:0 0 4px var(--red)}
.conn-status.reconnecting{background:rgba(154,107,31,.08);color:var(--yellow)}
.conn-status.reconnecting .conn-dot{background:var(--yellow);animation:pulse 1.2s infinite}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:.2s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* 思考折叠条 */
.think-bar{display:inline-flex;align-items:center;margin-left:8px}
.think-bar-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;
  background:linear-gradient(135deg,rgba(61,107,139,.08),rgba(90,107,63,.06));
  border:1px solid var(--border);border-radius:14px;cursor:pointer;
  font-size:11.5px;font-family:var(--sans);color:var(--ink2);transition:.15s;white-space:nowrap}
.think-bar-btn:hover{background:var(--paper3);border-color:var(--border2)}
.think-bar-arrow{font-size:9px;color:var(--muted);transition:transform .2s}
.think-bar.expanded .think-bar-arrow{transform:rotate(180deg)}

/* 思考详情面板 */
.think-detail{background:var(--paper2);border-bottom:1px solid var(--border);
  max-height:0;overflow:hidden;transition:max-height .3s ease;max-width:820px;
  margin:0 auto;width:100%}
.think-detail.open{max-height:400px;overflow-y:auto}
.think-detail-stream{padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.td-entry{display:flex;align-items:flex-start;gap:8px;padding:5px 8px;
  border-radius:var(--radius-sm);font-size:11.5px;line-height:1.5;
  font-family:var(--sans);border-left:2px solid transparent}
.td-entry.td-think{border-left-color:var(--blue);background:rgba(61,107,139,.03)}
.td-entry.td-tool{border-left-color:var(--yellow);background:rgba(154,107,31,.02)}
.td-entry.td-done{border-left-color:var(--green);background:rgba(90,107,63,.02)}
.td-entry.td-delegate{border-left-color:var(--blue);background:rgba(61,107,139,.03)}
.td-dot{width:5px;height:5px;border-radius:50%;margin-top:6px;flex-shrink:0;
  background:var(--accent);opacity:.6}
.td-entry.td-done .td-dot{background:var(--green);opacity:.8}
.td-entry.td-tool .td-dot{background:var(--yellow)}
.td-entry.td-delegate .td-dot{background:var(--blue)}
.td-text{flex:1;word-break:break-word;color:var(--ink2);font-size:11.5px}
.td-text b{color:var(--ink);font-weight:600}
.thinking-dots::after{content:"";animation:dots 1.4s infinite}
@keyframes dots{0%{content:"."}33%{content:".."}66%{content:"..."}}

/* ============ 聊天区 ============ */
.chat{flex:1;overflow-y:auto;padding:28px 24px 12px;max-width:820px;margin:0 auto;width:100%}
.main{display:flex;flex-direction:column;height:100vh}

/* 消息气泡 */
.msg{margin-bottom:24px;display:flex;flex-direction:column;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-items:flex-end}
.msg.assistant{align-items:flex-start}
.msg .role{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600;
  font-family:var(--sans);letter-spacing:.4px;padding:0 4px}
.msg.assistant .role{color:var(--accent)}
.msg.user .role{color:var(--accent2)}
.msg.user .bubble{background:linear-gradient(135deg,var(--paper3),var(--paper4));
  border:1px solid var(--border2);border-left:3px solid var(--accent2);
  color:var(--ink);padding:11px 16px;border-radius:12px 12px 4px 12px;max-width:78%;
  font-family:var(--sans);font-size:14px;line-height:1.85}
.msg.assistant .bubble{background:var(--paper2);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:14px 18px;max-width:100%;width:100%;
  font-family:var(--serif);font-size:15.5px;line-height:1.85}
.bubble{white-space:pre-wrap;word-break:break-word}

/* 气泡封口 */
.bubble.bubble-closed{opacity:.75;border-bottom:1px dashed var(--border2);margin-bottom:8px}

/* @委派 */
.delegate-speak{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;
  padding:8px 0 4px;border-top:1px solid var(--border);margin-top:8px}
.delegate-speak .at-tag{display:inline-flex;align-items:center;gap:4px;
  background:linear-gradient(135deg,var(--blue),var(--blue-soft));color:var(--paper);
  font-size:12px;font-weight:600;padding:3px 10px;border-radius:10px;white-space:nowrap;
  box-shadow:0 1px 3px rgba(61,107,139,.2)}
.delegate-speak .delegate-task{font-size:13px;color:var(--ink2);line-height:1.6;flex:1;min-width:120px}

/* 子agent气泡 */
.msg.sub-agent{align-items:flex-start;margin:12px 0;animation:subAgentIn .3s ease-out}
@keyframes subAgentIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.sub-agent .sub-role{font-size:12px;margin-bottom:0;display:flex;align-items:center;gap:6px;
  font-weight:600;padding:8px 14px;border-radius:var(--radius) var(--radius) 0 0;
  border:1px solid var(--border);border-bottom:none;background:var(--paper3)}
.msg.sub-agent .sub-bubble{background:var(--paper2);border:1px solid var(--border);
  border-top:none;border-radius:0 0 var(--radius) var(--radius);
  padding:12px 14px;max-width:100%;width:100%;font-family:var(--sans);
  font-size:15.5px;line-height:1.85;color:var(--ink2);box-shadow:var(--shadow-sm)}
.msg.sub-agent .sub-role{color:var(--blue)}
.msg.sub-agent .sub-bubble{border-color:rgba(61,107,139,.2)}
.msg.sub-agent .sub-role{background:rgba(61,107,139,.08);border-color:rgba(61,107,139,.2)}

.sub-task{font-size:12px;color:var(--ink2);background:var(--paper);
  padding:8px 10px;border-radius:var(--radius-sm);margin-bottom:8px;
  line-height:1.6;border-left:3px solid var(--blue);font-family:var(--sans)}
.sub-task-label{font-size:10.5px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}

.sub-think-wrap{margin:6px 0 8px;padding:8px 10px;background:var(--paper3);
  border-radius:var(--radius-sm);font-size:12px;color:var(--muted);
  border:1px dashed var(--border2)}
.sub-think-label{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;cursor:pointer}
.sub-think-body{white-space:pre-wrap;line-height:1.7;font-family:var(--mono);font-size:11.5px;color:var(--ink2)}

/* 子agent工具卡片 */
.sub-tool-cards{margin:8px 0;display:flex;flex-direction:column;gap:5px}
.sub-tool-card{padding:8px 10px;background:var(--paper);border:1px solid var(--border);
  border-radius:var(--radius-sm);font-size:11.5px;cursor:pointer;
  transition:all .15s;border-left:3px solid var(--yellow)}
.sub-tool-card:hover{border-color:var(--border2);background:var(--paper3)}
.sub-tool-card.done{border-left-color:var(--green);opacity:.85}
.stc-head{display:flex;align-items:center;gap:6px;font-family:var(--sans)}
.stc-icon{font-size:12px}
.stc-name{font-weight:600;color:var(--ink);font-size:11.5px}
.stc-status{margin-left:auto;font-size:10px;color:var(--muted)}
.stc-status.done{color:var(--green)}

.sub-answer-wrap{margin-top:6px}
.sub-answer-body{color:var(--ink);line-height:1.85}
.sub-answer-body p{margin:6px 0}

.msg.sub-agent.sub-done .sub-role{border-bottom:2px solid var(--green)}
.msg.sub-agent.sub-done .sub-role::after{content:" ✓";color:var(--green);font-size:11px}

/* 工具执行块 (主agent) */
.think-chain{margin:8px 0 6px;display:flex;flex-direction:column;gap:6px}
.think-block{position:relative;padding:8px 12px 8px 14px;border-radius:var(--radius);
  cursor:pointer;transition:all .2s ease;border:1px solid transparent;background:transparent}
.think-block:hover{background:rgba(46,31,21,.02);border-color:var(--border)}
.think-block::before{content:"";position:absolute;left:0;top:6px;bottom:6px;
  width:3px;border-radius:2px}
.think-block.tb-tool::before{background:linear-gradient(180deg,var(--yellow),#c4960f)}
.think-block.tb-done::before{background:linear-gradient(180deg,var(--green),#7aa85a)}
.tb-head{display:flex;align-items:center;gap:8px;font-size:12px;font-family:var(--sans);color:var(--ink2);padding:2px 0}
.tb-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.4px}
.tb-tag.exec{background:linear-gradient(135deg,rgba(154,107,31,.12),rgba(154,107,31,.06));
  color:var(--yellow);border:1px solid rgba(154,107,31,.18)}
.tb-tag.done{background:linear-gradient(135deg,rgba(90,107,63,.12),rgba(90,107,63,.06));
  color:var(--green);border:1px solid rgba(90,107,63,.18)}
.tb-title{color:var(--ink);font-weight:500;font-size:12px}
.tb-status{font-size:10.5px;color:var(--muted);margin-left:auto;margin-right:4px;font-weight:500}
.tb-status.ok{color:var(--green)}
.tb-body{font-size:11.5px;font-family:var(--mono);color:var(--muted);white-space:pre-wrap;
  padding:6px 0 2px 4px}
.tb-body .tb-args{color:var(--accent2);margin-top:4px;font-size:11px;
  background:rgba(90,107,63,.04);padding:6px 8px;border-radius:var(--radius-sm);
  border:1px solid rgba(90,107,63,.08)}
.tb-body .tb-result{color:var(--ink2);margin-top:6px;font-size:11px;
  background:var(--paper);padding:6px 8px;border-radius:var(--radius-sm);border:1px solid var(--border)}

/* 验收卡片 */
.collab-card{margin:10px 0;padding:12px 14px;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--paper2);font-family:var(--sans);
  font-size:13px;box-shadow:var(--shadow-sm)}
.collab-card .cc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-bottom:8px;font-weight:600}
.collab-card .cc-from{color:var(--ink);font-size:13px}
.collab-card .cc-status{margin-left:auto;font-size:11px;font-weight:600;
  color:var(--muted);padding:2px 8px;border-radius:10px;background:var(--paper3)}
.collab-card .cc-status.done{color:var(--green);background:rgba(90,107,63,.1);
  border:1px solid rgba(90,107,63,.2)}
.collab-card .cc-verdict{font-size:12.5px;color:var(--ink);line-height:1.7;
  padding:8px 10px;background:var(--paper);border-radius:var(--radius-sm);
  margin-top:6px;font-style:italic;border-left:3px solid var(--green)}
.collab-card.collab-pass{border-color:var(--green);
  background:linear-gradient(135deg,rgba(90,107,63,.04),var(--paper2))}

/* 完成提示 */
.done-note{font-size:12px;color:var(--green);margin-top:6px}
.done-note.muted{color:var(--muted)}

/* Composer */
.composer{border:1px solid var(--border);border-radius:24px;background:var(--paper);
  padding:8px 12px 8px 18px;max-width:820px;margin:0 auto 16px;width:100%;
  box-shadow:0 2px 8px rgba(46,31,21,.06);display:flex;align-items:center;gap:6px}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(161,61,61,.10)}
.composer-input-row{flex:1;display:flex;align-items:center;gap:6px}
.composer-input-row input{flex:1;background:transparent;border:none;color:var(--ink);
  padding:8px 4px;font-size:14px;font-family:var(--serif);line-height:1.7;outline:none}
.composer-input-row input::placeholder{color:var(--muted);font-family:var(--sans);font-size:13px}
.composer-send{flex-shrink:0;width:36px;height:36px;padding:0;border:none;
  display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
  font-size:16px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}

/* 底栏 */
.composer-bottom-row{display:flex;align-items:center;justify-content:center;
  max-width:820px;margin:0 auto 8px;width:100%;padding:0 0 0 4px}
.model-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;
  border-radius:var(--radius);font-size:12px;font-weight:600;font-family:var(--sans);
  color:var(--blue);border:1px solid transparent;cursor:pointer}

/* 空状态 */
.empty{text-align:center;color:var(--muted);margin-top:80px;padding:0 12px}
.empty-icon{font-size:44px;margin-bottom:14px;color:var(--accent);opacity:.65;
  display:inline-block;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.empty h2{color:var(--ink);margin-bottom:10px;font-family:var(--serif);letter-spacing:1.2px;font-size:26px}
.empty>p{color:var(--ink2);font-size:14px;max-width:560px;margin:0 auto 8px;line-height:1.6}
.suggestions{margin-top:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
  max-width:560px;margin-left:auto;margin-right:auto}
.sugg{background:var(--paper2);border:1px solid var(--border);color:var(--ink);padding:14px 16px;
  border-radius:var(--radius);cursor:pointer;font-size:13px;text-align:left;
  transition:.18s;font-family:var(--sans);line-height:1.5}
.sugg::before{content:"→";color:var(--accent);font-weight:700;font-size:14px;opacity:.7;margin-right:6px}
.sugg:hover{border-color:var(--accent);background:var(--paper3);box-shadow:var(--shadow-md);transform:translateY(-1px)}

/* 预览控制栏 */
.preview-bar{background:var(--paper2);border-bottom:1px solid var(--border);
  padding:8px 16px;display:flex;align-items:center;gap:12px;font-size:12px;
  font-family:var(--sans);color:var(--ink2)}
.preview-bar .tag{background:var(--accent);color:#fff;padding:2px 8px;border-radius:8px;
  font-size:10px;font-weight:700}
.preview-bar button{padding:4px 10px;border:1px solid var(--border);background:var(--paper);
  border-radius:var(--radius-sm);cursor:pointer;font-size:11px;color:var(--ink);font-family:var(--sans)}
.preview-bar button:hover{background:var(--paper3);border-color:var(--accent)}
.preview-bar .sep{width:1px;height:16px;background:var(--border)}
</style>
</head>
<body>

<!-- 预览控制栏 -->
<div class="preview-bar">
  <span class="tag">PREVIEW</span>
  <span>天衍 前端预览 — 多Agent协同 + 思考折叠 + 独立气泡</span>
  <div class="sep"></div>
  <button onclick="showDemo('empty')">空状态</button>
  <button onclick="showDemo('chat')">对话演示</button>
  <button onclick="showDemo('subagent')">多Agent协同</button>
  <div class="sep"></div>
  <span style="color:var(--muted)">无需后端，纯前端预览</span>
</div>

<div class="main">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="logo"><span>✦</span> 天衍</div>
    <div class="proj-info">洪荒仙侠 · 男频</div>
    <div class="spacer"></div>
    <!-- 思考折叠条 -->
    <div class="think-bar" id="think-bar" style="display:none">
      <button class="think-bar-btn" onclick="toggleThink()">
        <span>🧠</span>
        <span id="think-bar-text">思考中…</span>
        <span class="think-bar-arrow" id="think-bar-arrow">▼</span>
      </button>
    </div>
    <!-- 连接状态 -->
    <div class="conn-status online" id="conn-status">
      <span class="conn-dot"></span>
    </div>
  </header>

  <!-- 思考详情面板 -->
  <div class="think-detail" id="think-detail">
    <div class="think-detail-stream" id="think-detail-stream"></div>
  </div>

  <!-- 聊天区 -->
  <div class="chat" id="chat">
    <div class="empty" id="empty-state">
      <div class="empty-icon">✦</div>
      <h2>天衍</h2>
      <p>多Agent协同的长篇小说创作系统。7个专家agent，5阶段写作流水线，毒舌审稿+质检打回循环。</p>
      <div class="suggestions">
        <button class="sugg" onclick="showDemo('chat')">从扫榜开始</button>
        <button class="sugg" onclick="showDemo('subagent')">多Agent协同演示</button>
      </div>
    </div>
  </div>

  <!-- Composer -->
  <div class="composer">
    <div class="composer-input-row">
      <input type="text" placeholder="输入指令…" />
    </div>
    <button class="composer-send">↑</button>
  </div>
  <div class="composer-bottom-row">
    <div class="model-chip">⚡ deepseek-v4-flash</div>
  </div>
</div>

<script>
// ============ 预览演示数据 ============

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

function showDemo(type) {
  const chat = document.getElementById("chat");
  const empty = document.getElementById("empty-state");
  const thinkBar = document.getElementById("think-bar");
  const thinkDetail = document.getElementById("think-detail");
  const thinkStream = document.getElementById("think-detail-stream");

  if (empty) empty.remove();
  chat.innerHTML = "";
  thinkBar.style.display = "none";
  thinkDetail.classList.remove("open");
  thinkStream.innerHTML = "";

  if (type === "empty") {
    chat.innerHTML = `<div class="empty" id="empty-state">
      <div class="empty-icon">✦</div>
      <h2>天衍</h2>
      <p>多Agent协同的长篇小说创作系统。</p>
    </div>`;
    return;
  }

  if (type === "chat") {
    demoSimpleChat(chat, thinkBar, thinkStream, thinkDetail);
  } else if (type === "subagent") {
    demoMultiAgent(chat, thinkBar, thinkStream, thinkDetail);
  }
}

// ============ 演示1: 简单对话 ============
function demoSimpleChat(chat, thinkBar, thinkStream, thinkDetail) {
  // 用户消息
  addMsg(chat, "user", "帮我构思一个黄河捞尸人题材的民俗悬疑小说大纲，12章");

  // 显示思考折叠条
  setTimeout(() => {
    thinkBar.style.display = "inline-flex";
    thinkBar.classList.remove("expanded");
    thinkStream.innerHTML = "";

    // 思考条目
    addThinkEntry(thinkStream, "轮1", "✓ 可行 · 用户要12章民俗悬疑大纲，题材=黄河捞尸人，可执行", "td-done");
    addThinkEntry(thinkStream, "调用", "🔍 扫榜调研 · 架构师", "td-tool");
    addThinkEntry(thinkStream, "调用", "📝 生成大纲 · 总编", "td-tool");
    addThinkEntry(thinkStream, "完成", "思考完成 · 可行 · 已规划2步执行计划", "td-done");

    // 更新顶栏摘要
    document.getElementById("think-bar-text").textContent = "思考完成 · 可行 · 已规划2步";

    // 总编气泡
    const ast = addMsg(chat, "assistant", "");

// ============ DOM 辅助函数 ============
function addMsg(chat, role, content) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="role ${role}">${role === "user" ? "你" : "✦ 天衍"}</div>
    <div class="bubble">${content}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addSubAgent(chat, icon, name, task) {
  const div = document.createElement("div");
  div.className = "msg sub-agent";
  div.innerHTML = `<div class="role sub-role">${icon} ${esc(name)}</div>
    <div class="bubble sub-bubble">
      ${task ? `<div class="sub-task"><div class="sub-task-label">📦 接到任务</div>${esc(task)}</div>` : ""}
      <div class="sub-think-wrap" hidden></div>
      <div class="sub-tool-cards"></div>
      <div class="sub-answer-wrap"></div>
    </div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addSubThink(sub, text) {
  const wrap = sub.querySelector(".sub-think-wrap");
  wrap.hidden = false;
  wrap.innerHTML = `<div class="sub-think-label">💭 思考过程</div><div class="sub-think-body">${esc(text)}</div>`;
  wrap.closest(".sub-bubble").closest(".msg").scrollIntoView({behavior:"smooth",block:"end"});
}

function addSubToolCard(sub, name, status) {
  const cards = sub.querySelector(".sub-tool-cards");
  const card = document.createElement("div");
  card.className = `sub-tool-card ${status === "done" ? "done" : ""}`;
  card.innerHTML = `<div class="stc-head">
    <span class="stc-icon">🔧</span>
    <span class="stc-name">${esc(name)}</span>
    <span class="stc-status ${status === "done" ? "done" : ""}">${status === "done" ? "✓ 完成" : "执行中…"}</span>
  </div>`;
  cards.appendChild(card);
  card.closest(".sub-bubble").closest(".msg").scrollIntoView({behavior:"smooth",block:"end"});
}

function addSubAnswer(sub, text) {
  const wrap = sub.querySelector(".sub-answer-wrap");
  wrap.innerHTML = `<div class="sub-answer-body">${esc(text)}</div>`;
  // 折叠思考区
  const thinkWrap = sub.querySelector(".sub-think-wrap");
  if (thinkWrap) {
    const lbl = thinkWrap.querySelector(".sub-think-label");
    if (lbl) {
      lbl.textContent = "💭 思考过程 (已完成，点击展开)";
      lbl.style.cursor = "pointer";
      const body = thinkWrap.querySelector(".sub-think-body");
      body.hidden = true;
      lbl.onclick = () => { body.hidden = !body.hidden; };
    }
  }
  sub.scrollIntoView({behavior:"smooth",block:"end"});
}

function addThinkEntry(stream, tag, text, cls) {
  const div = document.createElement("div");
  div.className = `td-entry ${cls}`;
  div.innerHTML = `<span class="td-dot"></span><span class="td-text"><b>${esc(tag)}</b> ${esc(text)}</span>`;
  stream.appendChild(div);
  stream.scrollTop = stream.scrollHeight;
}

function toggleThink() {
  const bar = document.getElementById("think-bar");
  const detail = document.getElementById("think-detail");
  if (detail.classList.contains("open")) {
    detail.classList.remove("open");
    bar.classList.remove("expanded");
  } else {
    detail.classList.add("open");
    bar.classList.add("expanded");
  }
}
</script>
